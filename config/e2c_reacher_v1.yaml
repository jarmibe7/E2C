#
# Config file reacher ClosedLoopRandomTrainer
#
# Encoder/Decoder
vae:
  enc_latent_size: 256
  enc_kernel_size: 3
  dec_kernel_size: 4
  stride: 2
  pad: 1
# Loss hyperparams
loss:
  loss_type: uncertainty            # Loss type to use: default | uncertainty
  recon_mult: !!float 0.0           # MSE Reconstruction loss multiplier
  beta: !!float 1e-4                # Standard Gaussian KL multiplier
  lambda: !!float 1e-4              # Transition KL multiplier
  kld_anneal_mode: linear           # Beta annealing mode: const | linear
# Transition model hyperparams
trans:
  latent_size: 4                    # Transition model latent dim
  past_length: 3                    # Length of image history passed into encoder
  pred_length: 1                    # Length of image prediction horizon
  alpha: !!float 1e-4               # Learning rate
  weight_decay: !!float 1e-4        # Adam optimizer weight decay
# Training settings
train:
  dataset: reacher_5k    # Which dataset to use for training (in data/)
  batch_size: 32
  num_epochs: 100
  device: cuda:2             # cpu | cuda:0 | cuda:1 | cuda:2
  render: False              # Whether to render live interactive training plot, or simply save after training is finished
  save: True                 # Whether to save final trained model and training plot
  plot_freq: 10000           # Frequency to update the plot, in timesteps
  eval: True                 # Whether to eval model performance immediately after training
  train_ratio: 0.9           # Ratio of dataset to use for training
  load_path:  # Path to load model from (for resuming training or eval only)  
# Policy settings for training closed loop
closed_loop: 
  closed_loop: True                 # Whether to use closed loop training
  policy: random                    # What type of policy to use: conv | random | uncertainty
  num_rollout_steps: 1000          # Number of timesteps to collect in a rollout
  num_batches: 400                  # Number of batches to train on per gradient update
  buffer_capacity: 3000            # Replay buffer capacity
  alpha: !!float 1e-5               # Policy learning rate
  weight_decay: !!float 1e-4        # Policy Adam optimizer weight decay
