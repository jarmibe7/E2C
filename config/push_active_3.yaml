#
# Config file for push, closed loop with EIG and RSSM transition model
#
# Encoder/Decoder
vae:
  enc_latent_size: 256
  enc_kernel_size: 3
  dec_kernel_size: 4
  stride: 2
  pad: 1
# Loss hyperparams
loss:
  loss_type: rssm         # Loss type to use: mse | uncertainty  # TODO: Change this setup for rssm
  recon_mult: !!float 1e4           # MSE Reconstruction loss multiplier
  beta: !!float 1e-4                # Standard Gaussian KL multiplier
  lambda: !!float 1e-4              # Transition KL multiplier
  kld_anneal_mode: linear           # Beta annealing mode: const | linear
# Transition model hyperparams
trans:
  stochastic_size: 4                # Stochastic state model latent dim
  deterministic_size: 128             # Deterministic state model latent dim
  past_length: 2                    # Length of image history passed into encoder
  pred_length: 5                    # Length of image prediction horizon
  alpha: !!float 1e-4               # Learning rate
  weight_decay: !!float 1e-4        # Adam optimizer weight decay
# Training settings
train:
  dataset: push_2k      # Which dataset to use for training (in data/)
  batch_size: 128
  num_epochs: 100
  device: cuda:2             # cpu | cuda:0 | cuda:1 | cuda:2
  render: False              # Whether to render live interactive training plot, or simply save after training is finished
  save: True                 # Whether to save final trained model and training plot
  eval: True                 # Whether to eval model performance immediately after training
  plot_freq: 10000           # Frequency to update the plot, in timesteps
  train_ratio: 0.9           # Ratio of dataset to use for training
  load_path: runs/push/2026-01-15_03-58-47                 # Path to load model from (for resuming training or eval only)    
  eval_only: True            # Whether to only eval the model without training
# Policy settings for training closed loop
closed_loop: 
  closed_loop: True                 # Whether to use closed loop training
  policy: informative                    # What type of policy to use: conv | random | uncertainty | informative
  epochs_warmup: 3                  # Number of epochs to train on random actions before informative training
  num_rollout_steps: 2000           # Number of timesteps to collect in a rollout - keeping it small just to debug
  num_batches: 500                    # Number of batches to train on per gradient update
  buffer_capacity: 2000             # Replay buffer capacity - keeping it small just to debug
  samples:  25                      # Number of action sequences to sample for MPC
  elite_frac: 0.1                   # Fraction of action sequences to use as elites for CEM
  iters: 2                          # Number of CEM iterations
  init_control: random              # Initial control sequence: zero | random | from_txt
  sigma_init: 0.5                   # Initial stddev for sampling actions
  sigma_min: 0.05                   # Minimum stddev for sampling actions
  alpha: 0.7                        # Smoothing factor for updating action distribution

# env_inters = num_epochs * num_rollout_steps - # interactions collected from environment
    # 100 * 2000 = 200,000
# training_inters = num_batches * batch_size * num_epochs - # interactions agents trained on
    # 500 * 128 * 100 = 6,400,000, ~6.4M
# num_rollout_steps * num_epochs * cem_iters * samples - # iteractions collected and imagined
    # 2000 * 100 * 2 * 25 = 10,000,000, ~10M
